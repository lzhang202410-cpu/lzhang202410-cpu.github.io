<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional English Vocab Tutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        header h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: -webkit-linear-gradient(45deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            flex: 1 1 auto;
            min-width: 100px;
        }
        .tab-btn:hover { background: rgba(59, 130, 246, 0.3); }
        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }
        .filters {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .filters select, .filters input {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            outline: none;
            width: 100%;
            font-size: 1rem;
        }
        .hidden { display: none !important; }

        /* List View */
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            gap: 1rem;
        }
        @media(min-width: 600px) {
            .word-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
            .filters { flex-direction: row; justify-content: center; }
            .filters select, .filters input { width: auto; }
            header h1 { font-size: 2.5rem; }
        }
        .word-card {
            background: var(--card-bg);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }
        .word-card:active { transform: scale(0.98); }
        .word-card h3 { color: #60a5fa; margin-bottom: 0.5rem; font-size: 1.2rem; }
        .category-tag {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: var(--text-muted);
            display: inline-block;
            margin-top: 0.5rem;
        }

        /* Flashcard */
        .flashcard-container {
            perspective: 1000px;
            max-width: 100%;
            margin: 0 auto;
        }
        .flashcard {
            width: 100%;
            height: 60vh;
            max-height: 400px;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(15px);
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .flashcard-front h2, .flashcard-back h2 { font-size: 2rem; color: #fff; margin: auto; word-break: break-word; }
        .flashcard-back { transform: rotateY(180deg); background: rgba(59, 130, 246, 0.2); }
        .flashcard-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            gap: 1rem;
        }
        .flashcard-controls button {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }
        .flashcard-controls button:active { background: var(--primary); transform: scale(0.95); }

        /* Quiz */
        .quiz-container { 
            max-width: 600px; margin: 0 auto; background: var(--card-bg); 
            padding: 1.5rem; border-radius: 16px; text-align: center; 
            border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); 
        }
        .quiz-options { display: grid; grid-template-columns: 1fr; gap: 0.75rem; margin-top: 1.5rem; }
        @media(min-width: 600px) {
            .quiz-options { grid-template-columns: 1fr 1fr; }
        }
        .quiz-option {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1.25rem;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .quiz-option:active { background: rgba(255,255,255,0.15); transform: scale(0.98); }
        .quiz-option.correct { background: var(--success) !important; border-color: var(--success); }
        .quiz-option.wrong { background: var(--danger) !important; border-color: var(--danger); }
        .feedback { margin-top: 1.5rem; font-size: 1.1rem; font-weight: bold; min-height: 1.5rem; }
        #btn-next-question { 
            margin-top: 1rem; background: var(--primary); border: none; 
            padding: 1rem 2rem; border-radius: 12px; color: white; 
            font-size: 1.1rem; font-weight:bold; cursor: pointer; width: 100%;
        }
        #btn-next-question:active { transform: scale(0.98); }
        .progress { text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="app-container">

        <main>

                ⚠️ 警告：当前环境未运行代码，可能是因为您正处于微信/QQ的“文件预览”模式。<br><br>
                👉 请点击右上角的菜单 (⋮ 或 ⋯)，选择<b>“在浏览器打开”</b>或<b>“用其他应用打开”</b>（如 Safari、Chrome 等）即可正常显示卡片！
            </div>
            <!-- List View -->
            <section id="list-view" class="view-section active">
                <div class="word-grid" id="word-grid"></div>
            </section>

            <!-- Flashcard View -->
            <section id="flashcard-view" class="view-section hidden">
                <div class="flashcard-container">
                    <div class="flashcard" id="flashcard">
                        <div class="flashcard-inner">
                            <div class="flashcard-front">
                                <h2 id="fc-word">Word</h2>
                                <p id="fc-category" class="category-tag">Category</p>
                                <p style="font-size: 0.8rem; margin-top: 1rem; opacity: 0.5;">Tap to flip</p>
                            </div>
                            <div class="flashcard-back">
                                <h2 id="fc-translation">Translation</h2>
                                <p style="font-size: 0.8rem; margin-top: 1rem; opacity: 0.5;">Tap to flip</p>
                            </div>
                        </div>
                    </div>
                    <div class="flashcard-controls">
                        <button id="btn-prev">← Prev</button>
                        <button id="btn-next">Next →</button>
                    </div>
                    <p class="progress" id="fc-progress">1 / 100</p>
                </div>
            </section>

            <!-- Quiz View -->
            <section id="quiz-view" class="view-section hidden">
                <div class="quiz-container">
                    <h2 id="quiz-question" style="font-size: 1.2rem; font-weight: normal;">What is the translation for:<br><span style="color:#60a5fa; margin-top:1rem; display:block; font-size:1.8rem; font-weight: 600;">Word</span></h2>

                        <!-- Buttons injected here -->
                    </div>
                    <p id="quiz-feedback" class="feedback"></p>
                    <button id="btn-next-question" class="hidden">Next Question</button>
                    <p class="progress" id="quiz-progress">Score: 0 / 0</p>
                </div>
            </section>
        </main>
    </div>

// --- APP LOGIC ---
let currentList = [];
let fcIndex = 0;

const DOM = {
    tabs: document.querySelectorAll('.tab-btn'),
    views: document.querySelectorAll('.view-section'),
    categoryFilter: document.getElementById('category-filter'),
    searchInput: document.getElementById('search-input'),
    wordGrid: document.getElementById('word-grid'),
    
    fcWord: document.getElementById('fc-word'),
    fcTranslation: document.getElementById('fc-translation'),
    fcCategory: document.getElementById('fc-category'),
    flashcard: document.getElementById('flashcard'),
    btnPrev: document.getElementById('btn-prev'),
    btnNext: document.getElementById('btn-next'),
    fcProgress: document.getElementById('fc-progress'),

    quizQuestion: document.querySelector('#quiz-question span'),
    quizOptions: document.getElementById('quiz-options'),
    quizFeedback: document.getElementById('quiz-feedback'),
    btnNextQ: document.getElementById('btn-next-question'),
    quizProgress: document.getElementById('quiz-progress')
};

let quizScore = 0;
let quizTotal = 0;
let currentQuizWord = null;

function init() {
    currentList = [...vocabData];
    renderList();
    updateFlashcard();
    
    DOM.tabs.forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));
    DOM.categoryFilter.addEventListener('change', filterData);
    DOM.searchInput.addEventListener('input', filterData);
    
    DOM.flashcard.addEventListener('click', () => DOM.flashcard.classList.toggle('flipped'));
    DOM.btnPrev.addEventListener('click', () => {
        if(fcIndex > 0) { fcIndex--; updateFlashcard(); }
    });
    DOM.btnNext.addEventListener('click', () => {
        if(fcIndex < currentList.length - 1) { fcIndex++; updateFlashcard(); }
    });

    DOM.btnNextQ.addEventListener('click', loadQuizQuestion);
}

function switchTab(tabId) {
    DOM.tabs.forEach(t => t.classList.remove('active'));
    document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
    
    DOM.views.forEach(v => v.classList.add('hidden'));
    document.getElementById(`${tabId}-view`).classList.remove('hidden');

    if(tabId === 'quiz') {
        quizScore = 0; quizTotal = 0;
        loadQuizQuestion();
    }
}

function filterData() {
    const query = DOM.searchInput.value.toLowerCase();
    const cat = DOM.categoryFilter.value;
    
    currentList = vocabData.filter(item => {
        const matchQuery = item.w.toLowerCase().includes(query) || item.t.toLowerCase().includes(query);
        const matchCat = cat === 'all' || item.c.includes(cat);
        return matchQuery && matchCat;
    });
    
    fcIndex = 0;
    renderList();
    updateFlashcard();
}

function renderList() {
    if(currentList.length === 0) {
        DOM.wordGrid.innerHTML = '<p style="text-align:center; width:100%; color:#94a3b8;">No words found matching your criteria.</p>';
        return;
    }
    DOM.wordGrid.innerHTML = currentList.map(item => `
        <div class="word-card">
            <h3>${item.w}</h3>
            <p>${item.t}</p>
            <span class="category-tag">${item.c}</span>
        </div>
    `).join('');
}

function updateFlashcard() {
    if(currentList.length === 0) {
        DOM.fcWord.textContent = "N/A";
        DOM.fcTranslation.textContent = "N/A";
        DOM.fcCategory.textContent = "";
        DOM.fcProgress.textContent = "0 / 0";
        return;
    }
    DOM.flashcard.classList.remove('flipped');
    const item = currentList[fcIndex];
    
    setTimeout(() => {
        DOM.fcWord.textContent = item.w;
        DOM.fcTranslation.textContent = item.t;
        DOM.fcCategory.textContent = item.c;
        DOM.fcProgress.textContent = `${fcIndex + 1} / ${currentList.length}`;
    }, 150);
}

function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function loadQuizQuestion() {
    if(currentList.length < 4) {
        DOM.quizQuestion.innerHTML = "Not enough words in this category to generate a quiz.";
        DOM.quizOptions.innerHTML = '';
        return;
    }
    
    DOM.btnNextQ.classList.add('hidden');
    DOM.quizFeedback.textContent = '';
    
    currentQuizWord = currentList[Math.floor(Math.random() * currentList.length)];
    DOM.quizQuestion.textContent = currentQuizWord.w;
    
    let wrongOptions = currentList.filter(item => item.w !== currentQuizWord.w);
    wrongOptions = shuffle(wrongOptions).slice(0, 3);
    
    let options = [currentQuizWord, ...wrongOptions];
    options = shuffle(options);
    
    DOM.quizOptions.innerHTML = options.map(opt => 
        `<button class="quiz-option" data-correct="${opt.w === currentQuizWord.w}">${opt.t}</button>`
    ).join('');
    
    document.querySelectorAll('.quiz-option').forEach(btn => {
        btn.addEventListener('click', handleQuizAnswer);
    });
}

function handleQuizAnswer(e) {
    const isCorrect = e.target.dataset.correct === 'true';
    const btns = document.querySelectorAll('.quiz-option');
    
    btns.forEach(btn => btn.disabled = true);
    
    if(isCorrect) {
        e.target.classList.add('correct');
        DOM.quizFeedback.textContent = "Correct! 🎉";
        DOM.quizFeedback.style.color = "var(--success)";
        quizScore++;
    } else {
        e.target.classList.add('wrong');
        DOM.quizFeedback.textContent = `Wrong! The correct answer is: ${currentQuizWord.t}`;
        DOM.quizFeedback.style.color = "var(--danger)";
        btns.forEach(btn => {
            if(btn.dataset.correct === 'true') btn.classList.add('correct');
        });
    }
    
    quizTotal++;
    DOM.quizProgress.textContent = `Score: ${quizScore} / ${quizTotal}`;
    DOM.btnNextQ.classList.remove('hidden');
}

// Hide the JS warning since JS is running
document.getElementById('js-warning').style.display = 'none';
init();
    </script>
</body>
</html>
